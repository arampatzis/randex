name: Publish to PyPI

on:
    push:
        tags:
        -   "v*"

jobs:
    test:
        name: Run tests before publish
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.11"

        -   name: Install Poetry
            run: pip install poetry==2.1.3

        -   name: Install dependencies
            run: poetry install

        -   name: Run tests
            run: poetry run pytest --cov=randex --cov=cli --cov-fail-under=90

        -   name: Type check
            run: poetry run mypy randex cli

    build-and-publish:
        name: Build and Publish
        runs-on: ubuntu-latest
        needs: [test]

        steps:
        -   name: Check out code
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.11"

        -   name: Install Poetry
            run: pip install poetry==2.1.3

        -   name: Install poetry-dynamic-versioning plugin
            run: poetry self add poetry-dynamic-versioning

        -   name: Configure Poetry
            run: poetry config pypi-token.pypi ${{ secrets.PYPI_API_TOKEN }}

        -   name: Install dependencies
            run: poetry install

        -   name: Build package
            run: poetry build

        -   name: Publish to PyPI
            run: poetry publish
