question: Έστω $f$ συνάρτηση πυκνότητας πιθανότητας. Ποιό από τα παρακάτω αληθεύει?

answers:
-   $f(x) > 0, \quad \forall x\in\mathbb{R}$
-   $f(x) \geq 0, \quad \forall x\in\mathbb{R}$
-   $\int_{-\infty}^{\infty} f(x) \dif x = 0$
-   $\int_{-\infty}^{\infty} f(x) \dif x = 1$
-   $\int_{-\infty}^{\infty} f(x) \dif x = \infty$

right_answers:
-   1
-   3


points: 2
